name: Build paper PDF

# The paper lives in the repo as LaTeX source, which GitHub renders as raw
# markup — unreadable to anyone who isn't going to compile it themselves.
# This builds paper/rl_trader.pdf on every change and commits it back, so the
# repository always carries a readable version.

on:
  push:
    paths:
      # 'paper/**' rather than 'paper/**.tex': the paper now includes a figure,
      # and a rebuild triggered only by source changes would let the committed
      # PDF go stale whenever a figure is regenerated.
      - 'paper/**'
      - 'tools/paper_to_markdown.py'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: rl_trader.tex
          working_directory: paper

      # The web version (paper/rl_trader.md) is what the portfolio site renders.
      # Built here so it cannot fall behind the LaTeX: it did, silently, when two
      # math commands had no mapping and the converter exited without writing.
      # An unmapped command now fails this job on the branch that adds it.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Convert to Markdown
        run: |
          pip install pypandoc_binary
          python tools/paper_to_markdown.py

      - name: Upload PDF as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: rl_trader-pdf
          path: paper/rl_trader.pdf
          if-no-files-found: error

      # Only on main. A bot commit on a PR branch carries "[skip ci]" in its
      # message, and a squash merge copies that message into main's commit,
      # which then skips CI on main (happened with #35 and #42). Branches still
      # compile the paper and upload the PDF above.
      - name: Commit the PDF back to the repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/rl_trader.pdf paper/rl_trader.md
          if git diff --staged --quiet; then
            echo "PDF and Markdown unchanged — nothing to commit."
          else
            git commit -m "Build paper PDF and Markdown from rl_trader.tex [skip ci]"
            git push
          fi
