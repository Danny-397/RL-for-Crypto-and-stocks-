name: Rigor experiments

# The heavy runs behind RESULTS.md §10 (pre-registered in
# docs/preregistration/2026-11-13-rigor.md). Hours of CPU, so never on PRs:
# push a branch named experiments/<anything> (a name containing 'benchmark'
# or 'trading' runs only that suite), or dispatch by hand once this
# file is on main. Each job uploads its run files; the last job aggregates them.

on:
  push:
    branches: ["experiments/**"]
  workflow_dispatch:
    inputs:
      suite:
        description: "benchmark, trading or all"
        default: all

concurrency:
  group: rigor-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONWARNINGS: ignore
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  benchmark:
    # Stage 1: is this PPO correct? 4 tasks x 3 arms x 10 seeds.
    if: (github.event_name == 'push' && !contains(github.ref_name, 'trading') && !contains(github.ref_name, 'diagnose') && !contains(github.ref_name, 'leakfree') && !contains(github.ref_name, 'repaired') && !contains(github.ref_name, 'headline') && !contains(github.ref_name, 'riskadj')) || (github.event_name == 'workflow_dispatch' && inputs.suite != 'trading')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        env: [Pendulum-v1, InvertedPendulum-v5, HalfCheetah-v5, Hopper-v5]
        arm: [ours, ours_tb, sb3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e . "stable-baselines3==2.9.2" "gymnasium[mujoco]"
      - name: Train 10 seeds
        run: python tools/ppo_benchmark.py run-many --env ${{ matrix.env }} --arm ${{ matrix.arm }} --seeds 0-9 --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.env }}-${{ matrix.arm }}
          path: results/ppo_benchmark/

  trading:
    # Stages 2-4: other implementations/algorithms, training budget, time-limit
    # handling, and the hindsight-free universe. Needs the archived data.
    if: (github.event_name == 'push' && !contains(github.ref_name, 'benchmark') && !contains(github.ref_name, 'diagnose') && !contains(github.ref_name, 'leakfree') && !contains(github.ref_name, 'repaired') && !contains(github.ref_name, 'headline') && !contains(github.ref_name, 'riskadj')) || (github.event_name == 'workflow_dispatch' && inputs.suite != 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        market: [stock, crypto]
        arm: [ours, ours_tb, sb3_ppo, sb3_sac]
        seeds: ["200-203", "204-207", "208-209"]
        universe: [main]
        include:
          - {market: stock, arm: ours, seeds: "200-204", universe: pit}
          - {market: stock, arm: ours, seeds: "205-209", universe: pit}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e . "stable-baselines3==2.9.2"
      - name: Unpack the archived data
        env:
          KEY: ${{ secrets.RIGOR_DATA_KEY }}
        run: |
          test -n "$KEY" || { echo "RIGOR_DATA_KEY is not set"; exit 1; }
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEY" -d data/encrypted/rigor-data-2026-11-13.tgz.gpg > /tmp/d.tgz
          mkdir -p data/raw data/raw_pit && tar xzf /tmp/d.tgz -C data/raw stock crypto && tar xzf /tmp/d.tgz -C data/raw_pit --strip-components=1 pit/stock
          python tools/fetch_data.py --verify --out data/raw --snapshot docs/preregistration/2026-10-28-fresh-seeds.SNAPSHOT.json
          python tools/fetch_data.py --verify --out data/raw_pit --snapshot data/SNAPSHOT_pit.json
      - name: Train
        run: |
          MAX=""
          if [ "${{ matrix.universe }}" = "pit" ]; then MAX="--max-steps 150000"; fi
          python tools/trading_rigor.py run-many --market ${{ matrix.market }} --arm ${{ matrix.arm }} \
            --universe ${{ matrix.universe }} --seeds ${{ matrix.seeds }} --jobs 4 $MAX
      - uses: actions/upload-artifact@v4
        with:
          name: trading-${{ matrix.universe }}-${{ matrix.market }}-${{ matrix.arm }}-${{ matrix.seeds }}
          path: results/trading_rigor/

  diagnose:
    # Added after the registered run: find why `ours` trails SB3 (one change per
    # arm), and re-run the trading study with the repaired PPO.
    if: github.event_name == 'push' && contains(github.ref_name, 'diagnose')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        env: [Pendulum-v1, InvertedPendulum-v5, HalfCheetah-v5, Hopper-v5]
        # Round 2 (branch experiments/diagnose2): the update-step differences.
        arm: ${{ fromJSON(contains(github.ref_name, 'diagnose2') && '["ours_vloss","ours_eps","ours_mbadv","ours_sb3like"]' || '["ours_sep","ours_norm","ours_nosquash","ours_fixed"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e . "stable-baselines3==2.9.2" "gymnasium[mujoco]"
      - name: Train 10 seeds
        run: python tools/ppo_benchmark.py run-many --env ${{ matrix.env }} --arm ${{ matrix.arm }} --seeds 0-9 --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.env }}-${{ matrix.arm }}
          path: results/ppo_benchmark/

  retrade:
    if: github.event_name == 'push' && contains(github.ref_name, 'diagnose') && !contains(github.ref_name, 'diagnose2')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        market: [stock, crypto]
        seeds: ["200-204", "205-209"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e .
      - name: Unpack the archived data
        env:
          KEY: ${{ secrets.RIGOR_DATA_KEY }}
        run: |
          test -n "$KEY" || { echo "RIGOR_DATA_KEY is not set"; exit 1; }
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEY" -d data/encrypted/rigor-data-2026-11-13.tgz.gpg > /tmp/d.tgz
          mkdir -p data/raw && tar xzf /tmp/d.tgz -C data/raw stock crypto
          python tools/fetch_data.py --verify --out data/raw --snapshot docs/preregistration/2026-10-28-fresh-seeds.SNAPSHOT.json
      - name: Train
        run: python tools/trading_rigor.py run-many --market ${{ matrix.market }} --arm ours_fixed --seeds ${{ matrix.seeds }} --jobs 5
      - uses: actions/upload-artifact@v4
        with:
          name: trading-main-${{ matrix.market }}-ours_fixed-${{ matrix.seeds }}
          path: results/trading_rigor/

  leakfree:
    # Added after finding that per-ticker crypto splits overlap in calendar time
    # (RESULTS.md §10): the crypto study again, every coin cut on one date.
    if: github.event_name == 'push' && contains(github.ref_name, 'leakfree')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arm: [ours, ours_fixed, sb3_ppo, sb3_sac]
        seeds: ["200-203", "204-207", "208-209"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e . "stable-baselines3==2.9.2"
      - name: Unpack the archived data
        env:
          KEY: ${{ secrets.RIGOR_DATA_KEY }}
        run: |
          test -n "$KEY" || { echo "RIGOR_DATA_KEY is not set"; exit 1; }
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEY" -d data/encrypted/rigor-data-2026-11-13.tgz.gpg > /tmp/d.tgz
          mkdir -p data/raw && tar xzf /tmp/d.tgz -C data/raw stock crypto
          python tools/fetch_data.py --verify --out data/raw --snapshot docs/preregistration/2026-10-28-fresh-seeds.SNAPSHOT.json
      - name: Train
        run: python tools/trading_rigor.py run-many --market crypto --arm ${{ matrix.arm }} --split common --seeds ${{ matrix.seeds }} --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: trading-common-crypto-${{ matrix.arm }}-${{ matrix.seeds }}
          path: results/trading_rigor/

  repaired:
    # The PPO with every repair (matches SB3 on 3 of 4 benchmarks) on the
    # trading study: stocks, and crypto on the leak-free cut.
    if: github.event_name == 'push' && contains(github.ref_name, 'repaired')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {market: stock, split: ticker, seeds: "200-204"}
          - {market: stock, split: ticker, seeds: "205-209"}
          - {market: crypto, split: common, seeds: "200-204"}
          - {market: crypto, split: common, seeds: "205-209"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e .
      - name: Unpack the archived data
        env:
          KEY: ${{ secrets.RIGOR_DATA_KEY }}
        run: |
          test -n "$KEY" || { echo "RIGOR_DATA_KEY is not set"; exit 1; }
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEY" -d data/encrypted/rigor-data-2026-11-13.tgz.gpg > /tmp/d.tgz
          mkdir -p data/raw && tar xzf /tmp/d.tgz -C data/raw stock crypto
          python tools/fetch_data.py --verify --out data/raw --snapshot docs/preregistration/2026-10-28-fresh-seeds.SNAPSHOT.json
      - name: Train
        run: python tools/trading_rigor.py run-many --market ${{ matrix.market }} --arm ours_repaired --split ${{ matrix.split }} --seeds ${{ matrix.seeds }} --jobs 5
      - uses: actions/upload-artifact@v4
        with:
          name: trading-repaired-${{ matrix.market }}-${{ matrix.seeds }}
          path: results/trading_rigor/

  headline:
    # v2.3.0: rebuild the headline artefacts with the repaired PPO and the
    # leak-free split (now the defaults): the 10-seed significance study, the
    # dashboard run, the deployed policies and the reports read from them.
    if: github.event_name == 'push' && contains(github.ref_name, 'headline')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: [significance, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e .
      - name: Unpack the archived data
        env:
          KEY: ${{ secrets.RIGOR_DATA_KEY }}
        run: |
          test -n "$KEY" || { echo "RIGOR_DATA_KEY is not set"; exit 1; }
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEY" -d data/encrypted/rigor-data-2026-11-13.tgz.gpg > /tmp/d.tgz
          mkdir -p data/raw && tar xzf /tmp/d.tgz -C data/raw stock crypto
          python tools/fetch_data.py --verify --out data/raw --snapshot docs/preregistration/2026-10-28-fresh-seeds.SNAPSHOT.json
      - name: Significance (10 seeds)
        if: matrix.part == 'significance'
        run: python tools/real_significance.py --seeds 10 --seed-base 100 --timesteps 150000
      - name: Dashboard run, deployed policies, reports
        if: matrix.part == 'site'
        run: |
          python tools/build_site_data.py --real --timesteps 200000 --seed 42
          python tools/export_policy.py
          python tools/make_figures.py
          python tools/attribution_report.py
          python tools/supervised_report.py
          python tools/cost_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: headline-${{ matrix.part }}
          path: |
            docs/significance.js
            docs/results.js
            docs/assets/*.json
            docs/assets/*.png
            server/models/*.npz
            checkpoints/ppo_*.pt

  riskadj:
    # Risk-adjusted re-read of the published significance study: the same ten
    # seeds (100-109) on the same archived data, recording Sharpe ratios and the
    # agent's alpha/beta on each traded asset. Its total returns must equal the
    # published ones exactly, which doubles as a reproducibility check.
    if: github.event_name == 'push' && contains(github.ref_name, 'riskadj')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e .
      - name: Unpack the archived data
        env:
          KEY: ${{ secrets.RIGOR_DATA_KEY }}
        run: |
          test -n "$KEY" || { echo "RIGOR_DATA_KEY is not set"; exit 1; }
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEY" -d data/encrypted/rigor-data-2026-11-13.tgz.gpg > /tmp/d.tgz
          mkdir -p data/raw && tar xzf /tmp/d.tgz -C data/raw stock crypto
          python tools/fetch_data.py --verify --out data/raw --snapshot docs/preregistration/2026-10-28-fresh-seeds.SNAPSHOT.json
      - name: Significance with risk-adjusted measures (10 seeds)
        run: |
          mkdir -p results/riskadj
          python tools/real_significance.py --seeds 10 --seed-base 100 --timesteps 150000 --out results/riskadj/significance.js
      - uses: actions/upload-artifact@v4
        with:
          name: riskadj
          path: results/riskadj/

  aggregate:
    needs: [benchmark, trading, diagnose, retrade, leakfree, repaired, headline]
    # The riskadj job uploads its own artifact and has nothing to aggregate.
    if: always() && !contains(github.ref_name, 'riskadj')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e . "gymnasium[mujoco]"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate
        run: |
          mkdir -p results/ppo_benchmark results/trading_rigor
          find artifacts -path '*bench-*' -name '*.json' -exec cp {} results/ppo_benchmark/ \;
          find artifacts -path '*trading-*' -name '*.json' -exec cp {} results/trading_rigor/ \;
          ls results/ppo_benchmark | wc -l; ls results/trading_rigor | wc -l
          if ls results/ppo_benchmark/*.json >/dev/null 2>&1; then python tools/ppo_benchmark.py aggregate; fi
          if ls results/trading_rigor/*.json >/dev/null 2>&1; then python tools/trading_rigor.py aggregate; fi
      - uses: actions/upload-artifact@v4
        with:
          name: rigor-results
          path: |
            results/
            docs/assets/ppo_benchmark.json
            docs/assets/trading_rigor.json
