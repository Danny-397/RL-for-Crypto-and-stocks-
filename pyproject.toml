[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-trader"
version = "0.1.0"
description = "A modular PPO reinforcement-learning framework for trading stocks and crypto."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Danny Lichtenberger" }]
keywords = ["reinforcement-learning", "ppo", "trading", "quant", "crypto", "stocks"]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "torch>=2.0",
    "gymnasium>=0.29",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
rl-train-stock = "rl_trader.scripts.run_stock_training:main"
rl-train-crypto = "rl_trader.scripts.run_crypto_training:main"
rl-compare = "rl_trader.scripts.compare_markets:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_trader*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set explicitly. Without this, ruff lints against whatever its
# current release defaults to, so a new ruff version turns CI red with no code
# change — which is exactly what happened here. E4/E7/E9 + F are the real-error
# rules (undefined names, unused imports and variables, syntax problems); I
# keeps imports sorted. Stylistic modernisation rules (UP*) are deliberately
# out: target-version is py39 and the typing style is consistent as written.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `pytest` (the console script, as CI invokes it)
# can import the `rl_trader` package without an editable install.
pythonpath = ["."]
testpaths = ["tests"]
